# Manual run: builds a debug APK (Linux) and an unsigned IPA (macOS; iOS can't build on Linux).
# Set repo variable APP_URL to the deployed HTTPS web app — the native shell loads it.
name: mobile
on: workflow_dispatch
permissions:
  contents: read

env:
  APP_URL: ${{ vars.APP_URL }}
  APP_MODE: production

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci && npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: khaneh-behineh-apk, path: mobile/android/app/build/outputs/apk/debug/*.apk }

  ios:
    runs-on: macos-15
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci && npx cap sync ios
      - name: Archive unsigned
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive CODE_SIGNING_ALLOWED=NO archive
          mkdir -p build/Payload && cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build && zip -qr khaneh-behineh-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: khaneh-behineh-ipa, path: mobile/ios/App/build/*.ipa }
