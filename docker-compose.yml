services:
  backend:
    build: ./backend
    volumes:
      - leads:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3023:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  leads:
